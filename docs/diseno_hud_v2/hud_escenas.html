<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fundación HUD v2: escenas</title>
<style>
:root{--fondo:#120a22;--panel:#1d1236;--borde:#3a2766;--oro:#f2c94c;--claro:#efe6ff;--suave:#a99cc9;--cel:#8bd0ff;--mal:#ff8b8b;
--m:#7a5230;--l:#b5482e;--n:#8fc06a;--t:#e0b83a;--e:#7d8aa3}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--fondo);color:var(--claro);font:600 clamp(10px,1.7vmin,15px) 'Segoe UI',system-ui,sans-serif;overflow:hidden}
#mapa{position:absolute;inset:0;width:100%;height:100%;background:#0c1a33}
.abs{position:absolute}
.fila{display:flex;gap:.8vmin;align-items:center}
.col{display:flex;flex-direction:column;gap:.7vmin}
.caja{background:var(--panel);border:.3vmin solid var(--borde)}
.jug{display:flex;align-items:center;gap:.8vmin;padding:.6vmin 1vmin;background:var(--panel);border:.3vmin solid var(--borde);position:relative;min-width:19vmin}
.jug.turno{border-color:var(--oro);box-shadow:0 0 0 .3vmin var(--oro)}
.jug.fuera{opacity:.55;border-style:dashed}
.av{width:4.2vmin;height:4.2vmin;border:.3vmin solid #000;flex:none}
.pv{color:var(--oro);font-size:1.4em}.mini{color:var(--suave);font-size:.85em}
.plus{position:absolute;right:-.8vmin;top:-1vmin;background:var(--oro);color:#1a1030;border:.3vmin solid #000;padding:0 .8vmin;font-weight:800}
.carta{width:7vmin;height:9.6vmin;border:.35vmin solid #000;display:flex;align-items:center;justify-content:center;position:relative;flex:none;padding:1vmin}
.carta svg{width:100%;height:100%;shape-rendering:crispEdges}
.carta.g{width:12vmin;height:16vmin;cursor:pointer;padding:1.6vmin}
.carta.sel{transform:translateY(-2.2vmin);box-shadow:0 0 0 .5vmin var(--oro)}
.carta.sel::after{content:'✓';position:absolute;top:-1.6vmin;right:-1vmin;background:var(--oro);color:#1a1030;border:.3vmin solid #000;width:3vmin;height:3vmin;display:flex;align-items:center;justify-content:center}
.carta.nueva{box-shadow:0 0 0 .4vmin var(--oro);transform:translateY(-1.4vmin)}
.carta.vacia{background:#2a1a4d!important;border-style:dashed;opacity:.8}
.m{background:var(--m)}.l{background:var(--l)}.n{background:var(--n)}.t{background:var(--t)}.e{background:var(--e)}
.btn{background:var(--oro);color:#1a1030;border:.4vmin solid #000;padding:1.2vmin 2.6vmin;font:800 1.3em 'Segoe UI',sans-serif;cursor:pointer}
.btn.sec{background:var(--panel);color:var(--claro);border-color:var(--borde)}
.btn.off{background:#3a2d55;color:var(--suave);border-color:#000}
.btn:focus-visible{outline:.5vmin solid var(--cel)}
.mis{padding:.6vmin .9vmin;border-left:.7vmin solid var(--cel);background:#2a1a4d;margin-bottom:.5vmin;width:25vmin}
.mis.ped{border-left-color:var(--oro)}.mis small{display:block;color:var(--suave);font-weight:600}
.piezas{display:flex;gap:1.2vmin;padding:.6vmin 1vmin}
.dado{background:var(--panel);border:.3vmin solid var(--oro);padding:.8vmin 1.6vmin;font-size:1.2em}
.velo{position:absolute;inset:0;background:#05020ccc}
.centro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2vmin;pointer-events:none}
.centro>*{pointer-events:auto}
.titulo{font-size:1.9em;font-weight:800}
.sub{color:var(--suave);font-size:1.1em}
.grupo{display:flex;flex-direction:column;align-items:center;gap:.8vmin}
.opc{display:flex;gap:1.4vmin}
.op{width:22vmin;padding:1.2vmin;background:var(--panel);border:.4vmin solid var(--borde);display:flex;flex-direction:column;align-items:center;gap:1vmin;cursor:pointer;position:relative}
.op.si{border-color:var(--oro)}
.op.no{opacity:.45}
.op .nm{font-size:1.3em;font-weight:800}
.costo{display:flex;gap:.4vmin;min-height:6vmin;flex-wrap:wrap;justify-content:center}
.cm{width:3.6vmin;height:5.2vmin;border:.3vmin solid #000;display:flex;align-items:center;justify-content:center;padding:.5vmin}
.cm svg{width:100%;height:100%;shape-rendering:crispEdges}
.cm.falta{outline:.35vmin dashed var(--mal);outline-offset:.2vmin;opacity:.55}
.falta-tx{color:var(--mal);font-size:.9em}
.ok-tx{color:var(--n);font-size:.9em}
.num{background:#f5ecd0;color:#1a1030;border:.3vmin solid #000;border-radius:50%;width:4vmin;height:4vmin;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.2em}
.num.roj{color:#b5301e}
.sel-esc{position:fixed;top:.3vmin;left:50%;transform:translateX(-50%);z-index:9;display:flex;gap:.4vmin;flex-wrap:wrap;justify-content:center;max-width:70%}
.sel-esc button{background:var(--panel);color:var(--claro);border:.25vmin solid var(--borde);padding:.3vmin .9vmin;font:700 .85em 'Segoe UI';cursor:pointer}
.sel-esc button.on{background:var(--oro);color:#1a1030}
body.limpio .sel-esc{display:none}
.banner{background:var(--panel);border:.3vmin solid var(--oro);padding:.9vmin 2vmin;font-size:1.3em}
.tiempo{position:fixed;top:0;left:0;right:0;height:3vmin;background:#05020c;border-bottom:.3vmin solid var(--borde);z-index:8}
.tiempo i{display:block;height:100%;background:var(--cel);transition:width .3s}
.tiempo.poco i{background:var(--mal)}
.tiempo span{position:absolute;left:1vmin;top:0;height:100%;display:flex;align-items:center;font-size:.95em;font-weight:800;color:#fff;text-shadow:0 .2vmin 0 #000}
.dms{display:inline-flex;gap:.3vmin;flex-wrap:wrap;max-width:15vmin}.dm{display:block;width:1.8vmin;height:2.6vmin;background:#4b3a7a;border:.2vmin solid #000}
.dm.m{background:var(--m)}.dm.l{background:var(--l)}.dm.n{background:var(--n)}.dm.t{background:var(--t)}.dm.e{background:var(--e)}
.puesto{display:flex;align-items:center;gap:1.4vmin;width:44vmin;padding:.8vmin 1.2vmin;background:var(--panel);border:.3vmin solid var(--borde)}
.puesto.gana{border-color:var(--oro);box-shadow:0 0 0 .3vmin var(--oro)}
.barra{height:2vmin;background:var(--cel);border:.2vmin solid #000}
</style></head>
<body>
<script src="../../web/dados3d.js"></script>
<div class="sel-esc" id="sel"></div>
<svg id="mapa" viewBox="0 0 160 90" preserveAspectRatio="xMidYMid meet"></svg>
<div class="tiempo" id="tiempo"><i></i><span></span></div>
<div id="hud"></div>
<div id="capa"></div>
<script>
var NS='http://www.w3.org/2000/svg',svg=document.getElementById('mapa');
function el(t,a,p){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);(p||svg).appendChild(e);return e}
var col={m:'#3f7a3a',l:'#b5482e',n:'#8fc06a',t:'#e0b83a',e:'#7d8aa3'};
var tipos=['m','l','n','m','t','e','l','t','n','e','m','l','t','n','m','e','m','t','l'];
var nums=[6,3,8,2,4,5,10,5,9,6,11,10,4,9,12,3,8,11,5];
var filas=[3,4,5,4,3],R=9,hx=R*Math.sqrt(3),C=[];
function vt(i,a){var an=Math.PI/180*(60*a-30);return [C[i][0]+R*Math.cos(an),C[i][1]+R*Math.sin(an)]}
var E=location.search.match(/e=(\w+)/);E=E?E[1]:'turno';
var LIMPIO=/limpio/.test(location.search);if(LIMPIO)document.body.className='limpio';
var DADOS=false;
// íconos de los recursos (sin texto en las tarjetas)
var ICO={
 m:'<svg viewBox="0 0 16 16"><rect x="1" y="4" width="11" height="8" fill="#c99a62" stroke="#000"/><rect x="1" y="7" width="11" height="1" fill="#8a5f32"/><ellipse cx="12" cy="8" rx="2.5" ry="4" fill="#e6bd88" stroke="#000"/><circle cx="12" cy="8" r="1" fill="#8a5f32"/></svg>',
 l:'<svg viewBox="0 0 16 16"><rect x="1" y="3" width="14" height="10" fill="#e8825f" stroke="#000"/><path d="M1 8h14M8 3v5M4.5 8v5M11.5 8v5" stroke="#5a1f10" stroke-width="1" fill="none"/></svg>',
 n:'<svg viewBox="0 0 16 16"><circle cx="5" cy="9" r="3.2" fill="#f4f7e8" stroke="#000"/><circle cx="9" cy="6.5" r="3.6" fill="#f4f7e8" stroke="#000"/><circle cx="12" cy="10" r="2.8" fill="#f4f7e8" stroke="#000"/><rect x="4" y="9" width="9" height="3.6" fill="#f4f7e8"/></svg>',
 t:'<svg viewBox="0 0 16 16"><path d="M8 15V3" stroke="#000" stroke-width="1.6"/><path d="M8 3l-3 2 3 1 3-1zM8 7l-3 2 3 1 3-1zM8 11l-3 2 3 1 3-1z" fill="#fff3b0" stroke="#000" stroke-width=".8"/></svg>',
 e:'<svg viewBox="0 0 16 16"><polygon points="8,1 14,6 12,14 4,14 2,6" fill="#dce3ee" stroke="#000"/><polygon points="8,1 14,6 8,8" fill="#fff" opacity=".7"/><polygon points="2,6 8,8 4,14" fill="#a9b4c6"/></svg>'};
function dibujarMapa(){
  svg.innerHTML='';C=[];var k=0;
  filas.forEach(function(n,f){for(var i=0;i<n;i++){var cx=80+(i-(n-1)/2)*hx,cy=45+(f-2)*R*1.5;C.push([cx,cy]);var pts=[];
    for(var a=0;a<6;a++){var v=[cx+R*Math.cos(Math.PI/180*(60*a-30)),cy+R*Math.sin(Math.PI/180*(60*a-30))];pts.push(v[0].toFixed(1)+','+v[1].toFixed(1))}
    var hit=DADOS&&nums[k]==8;
    el('polygon',{points:pts.join(' '),fill:col[tipos[k]],stroke:hit?'#f2c94c':'#000','stroke-width':hit?'1.4':'.6',opacity:DADOS&&!hit?'.4':'1'});
    el('circle',{cx:cx,cy:cy,r:3.4,fill:'#f5ecd0',stroke:'#000','stroke-width':'.4',opacity:DADOS&&!hit?'.5':'1'});
    var t=el('text',{x:cx,y:cy+1.4,'text-anchor':'middle','font-size':4,'font-weight':800,fill:nums[k]==6||nums[k]==8?'#b5301e':'#222',opacity:DADOS&&!hit?'.5':'1'});t.textContent=nums[k];k++}});
}
function casa(p,c,ciudad){var w=ciudad?3.6:2.6;el('rect',{x:p[0]-w/2,y:p[1]-w/2,width:w,height:w,fill:c,stroke:'#000','stroke-width':'.5'});if(ciudad)el('rect',{x:p[0]-w/2,y:p[1]-w/2-1.4,width:w/2,height:1.4,fill:c,stroke:'#000','stroke-width':'.4'})}
function edificios(){
  casa(vt(16,5),'#f2c94c');casa(vt(2,1),'#8bd0ff');casa(vt(16,3),'#ff8b8b',true);
  casa(vt(8,2),'#f2c94c');casa(vt(12,0),'#8fc06a');casa(vt(3,3),'#8bd0ff');casa(vt(10,5),'#ff8b8b');
  [[vt(16,5),vt(16,0),'#f2c94c'],[vt(2,1),vt(2,2),'#8bd0ff']].forEach(function(s){el('line',{x1:s[0][0],y1:s[0][1],x2:s[1][0],y2:s[1][1],stroke:s[2],'stroke-width':'1.2'})});
}
// ---- jugadores y mano
var J=[['Tú','#f2c94c',6],['Ana','#8bd0ff',5,4],['Beto','#ff8b8b',4,5],['Cami','#8fc06a',3,3]];
var TURNO='Tú',FUERA='',HAND={m:2,l:1,n:1,t:1,e:1};
function expandir(o){var a=[];['m','l','n','t','e'].forEach(function(r){for(var i=0;i<(o[r]||0);i++)a.push(r)});return a}
function dorsos(n){var h='';for(var i=0;i<n;i++)h+='<i class="dm"></i>';return '<span class="dms">'+h+'</span>'}
function minis(arr){return '<span class="dms">'+arr.map(function(r){return '<i class="dm '+r+'"></i>'}).join('')+'</span>'}
function dorso(){return '<div class="carta" style="background:repeating-linear-gradient(45deg,#2a1a4d 0 .8vmin,#3a2766 .8vmin 1.6vmin)"></div>'}
function jug(j,mas){var yo=j[0]=='Tú';return '<div class="jug'+(j[0]==TURNO?' turno':'')+(j[0]==FUERA?' fuera':'')+'"><div class="av" style="background:'+j[1]+'"></div><div><div>'+j[0]+' <span class="pv">'+j[2]+' PV</span></div><div class="mini">'+(yo?minis(expandir(HAND)):dorsos(j[3]))+'</div></div>'+(mas?'<span class="plus">'+mas+'</span>':'')+'</div>'}
function carta(r,cls){return '<div class="carta '+(cls||'')+' '+r+'">'+ICO[r]+'</div>'}
function mano(nuevas,h){h=h||HAND;var a=expandir(h),extra=[];if(nuevas)for(var r in nuevas)for(var i=0;i<nuevas[r];i++)extra.push(r);
  return '<div class="fila">'+a.map(function(r){return carta(r)}).join('')+extra.map(function(r){return carta(r,'nueva')}).join('')+'<span class="mini" style="align-self:flex-end">'+(a.length+extra.length)+'/6</span></div>'}
function hud(opc){
  opc=opc||{};HAND=opc.h||{m:2,l:1,n:1,t:1,e:1};if(opc.nuevas)HAND=Object.assign({},HAND);
  var h='';
  h+='<div class="abs fila" style="top:4.2vmin;left:1vmin;align-items:flex-start"><div class="piezas caja"><span>Camino 11/15</span><span>Pueblo 3/5</span><span>Ciudad 4/4</span><span>Caballero 3/3</span></div></div>';
  h+='<div class="abs col" style="top:50%;transform:translateY(-50%);left:1vmin">'+(opc.dado?'<div class="dado">Tirada '+opc.dado+'</div>':'')+(opc.sinmis?'':'<div class="mis"><b>Camino más largo</b> +1 PV<small>Sin vencimiento</small></div><div class="mis"><b>Ejército de 2 caballeros</b> +1 PV<small>Sin vencimiento</small></div><div class="mis ped"><b>Entrega 2 madera + 2 ladrillo</b> +1 PV<small>Pedido · vence en 5 turnos</small></div><div class="mis ped"><b>Entrega 3 tarjetas iguales</b> +1 PV<small>Pedido · vence en 7 turnos</small></div>')+'</div>';
  h+='<div class="abs col" style="top:50%;transform:translateY(-50%);right:1vmin;align-items:stretch">'+J.map(function(j,i){return jug(j,opc.plus&&opc.plus[i])}).join('')+'</div>';
  if(!opc.sinmano)h+='<div class="abs" style="bottom:1vmin;left:50%;transform:translateX(-50%)">'+mano(opc.nuevas,HAND)+'</div>';
  if(!opc.sinbtn)h+='<div class="abs col" style="bottom:1vmin;right:1vmin;align-items:stretch"><button class="btn sec">Construir</button><button class="btn">Terminar turno</button></div>';
  document.getElementById('hud').innerHTML=h;
}
var capa=document.getElementById('capa');
// ---- selección de tarjetas (descarte y entrega de pedidos)
var sel={};
function seleccion(c){
  sel={};(c.pre||[]).forEach(function(i){sel[i]=1});
  function pintar(){
    var s=Object.keys(sel).length,falta=c.n-s,oblig=c.n>0;
    var txt=oblig?(falta>0?'Faltan '+falta:c.ok):(s>0?c.ok:'Pasar');
    capa.innerHTML='<div class="velo"></div><div class="centro"><div class="titulo">'+c.titulo+'</div>'+(c.cab||'')+(c.sub?'<div class="sub">'+c.sub+'</div>':'')+'<div class="fila" style="gap:1.4vmin;margin-top:1vmin">'+c.cartas.map(function(r,i){return carta(r,'g'+(sel[i]?' sel':'')).replace('<div class="carta','<div data-i="'+i+'" class="carta')}).join('')+'</div>'+(c.fijo?'<div class="fila" style="margin-top:2vmin;gap:1.6vmin"><button class="btn sec">Atrás</button><button class="btn" style="min-width:26vmin">'+c.ok+'</button></div>':'<button class="btn'+(oblig&&falta>0?' off':'')+'" style="margin-top:2vmin;min-width:26vmin">'+txt+'</button>')+'</div>';
    if(!c.fijo)capa.querySelectorAll('[data-i]').forEach(function(x){x.onclick=function(){var i=x.dataset.i;if(sel[i])delete sel[i];else if(!oblig||Object.keys(sel).length<c.n)sel[i]=1;pintar()}});
  }pintar();
}
function toast(t){var x=document.getElementById('toast');if(!x){x=document.createElement('div');x.id='toast';x.className='abs banner';x.style.cssText='top:8vmin;left:50%;transform:translateX(-50%);border-color:var(--mal);z-index:7';document.body.appendChild(x)}x.textContent=t;x.style.display='block';clearTimeout(x.t);x.t=setTimeout(function(){x.style.display='none'},2200)}
function avisos(){capa.querySelectorAll('.op.no[data-av]').forEach(function(o){o.onclick=function(){toast(o.dataset.av)}})}
function costoHTML(c,mano){var h='';for(var r in c){var tiene=mano[r]||0;for(var i=0;i<c[r];i++){h+='<div class="cm '+r+(i>=tiene?' falta':'')+'">'+ICO[r]+'</div>'}}return h}
var NOM={m:'madera',l:'ladrillo',n:'lana',t:'trigo',e:'mineral'};
function construir(m){
  var O=[['Camino',{m:1,l:1},'Une tus pueblos'],['Pueblo',{m:1,l:1,n:1,t:1},'+1 PV'],['Ciudad',{e:3,t:2},'+2 PV'],['Caballero',{n:1,t:1,e:1},'Protege un hexágono']];
  var ninguna=true;
  var h=O.map(function(o){var ok=true,f=[];for(var r in o[1])if((m[r]||0)<o[1][r]){ok=false;f.push(o[1][r]-(m[r]||0)+' '+NOM[r])}if(ok)ninguna=false;
    return '<div class="op '+(ok?'si':'no')+'" data-av="Te falta '+f.join(' y ')+'"><div class="nm">'+o[0]+'</div><div class="costo">'+costoHTML(o[1],m)+'</div><div class="mini">'+o[2]+'</div>'+(ok?'<div class="ok-tx">Puedes construir</div>':'<div class="falta-tx">Falta '+f.join(' y ')+'</div>')+'</div>'}).join('');
  capa.innerHTML='<div class="velo"></div><div class="centro"><div class="titulo">'+(ninguna?'No puedes construir nada':'¿Qué construyes?')+'</div><div class="opc">'+h+'</div><div class="fila" style="margin-top:4.2vmin">'+(ninguna?'<button class="btn" style="min-width:26vmin">Pasar</button>':'<button class="btn sec">Atrás</button>')+'</div></div><div class="abs" style="bottom:1vmin;left:50%;transform:translateX(-50%)">'+mano(null,m)+'</div>';avisos();
}
function colocar(){
  [[16,0],[16,4],[15,2],[13,5],[12,3]].forEach(function(p){var v=vt(p[0],p[1]);el('circle',{cx:v[0],cy:v[1],r:1.8,fill:'#f2c94c',stroke:'#000','stroke-width':'.5',opacity:'.9'})});
  capa.innerHTML='<div class="abs fila" style="top:4.2vmin;left:50%;transform:translateX(-50%)"><div class="banner">Elige dónde poner el camino</div></div><div class="abs col" style="bottom:1vmin;right:1vmin;align-items:stretch"><button class="btn sec">Atrás</button></div>';
}
// cartas que aparecen encima de cada pueblo o ciudad que produjo
function cartaSvg(x,y,r){var f=el('foreignObject',{x:x-3,y:y-8.6,width:6,height:8.4});
  f.innerHTML='<div xmlns="http://www.w3.org/1999/xhtml" class="carta '+r+'" style="width:100%;height:100%;border-width:.45px;padding:.7px">'+ICO[r]+'</div>'}
function llegan(){
  [[vt(16,5),'m',1]].forEach(function(s){
    for(var i=0;i<s[2];i++)cartaSvg(s[0][0]+(i-(s[2]-1)/2)*6.6,s[0][1]-2,s[1]);
  });
}
function pedidos(m,aviso){
  var P=[['Entrega 2 madera + 2 ladrillo',{m:2,l:2},'+1 PV · vence en 5 turnos'],['Entrega 3 tarjetas iguales',null,'+1 PV · vence en 7 turnos']];
  var h=P.map(function(o){var ok=true,f='';
    if(o[1]){for(var r in o[1])if((m[r]||0)<o[1][r]){ok=false;f=(o[1][r]-(m[r]||0))+' '+NOM[r]}}
    else{ok=Object.keys(m).some(function(r){return m[r]>=3});f='3 iguales'}
    return '<div class="op '+(ok?'si':'no')+'" data-av="'+(o[1]?'Te falta '+f:'Necesitas 3 tarjetas iguales')+'"><div class="nm">'+o[0]+'</div><div class="costo">'+(o[1]?costoHTML(o[1],m):'<div class="cm m">'+ICO.m+'</div><div class="cm m">'+ICO.m+'</div><div class="cm m">'+ICO.m+'</div>')+'</div><div class="mini">'+o[2]+'</div>'+(ok?'<div class="ok-tx">Puedes entregarlo</div>':'<div class="falta-tx">Falta '+f+'</div>')+'</div>'}).join('');
  var A='<div class="op no" style="opacity:1;border-color:var(--cel)"><div class="nm">Camino más largo</div><div class="mini">Llevas 3 de 5 caminos conectados</div><div class="mini">No se entrega: se cumple construyendo</div></div><div class="op no" style="opacity:1;border-color:var(--cel)"><div class="nm">Ejército</div><div class="mini">Llevas 1 de 2 caballeros</div><div class="mini">No se entrega: se cumple construyendo</div></div>';
  capa.innerHTML='<div class="velo"></div><div class="centro"><div class="titulo">Misiones y pedidos</div><div class="opc">'+A+h+'</div><div class="fila" style="margin-top:4.2vmin"><button class="btn sec">Atrás</button></div></div><div class="abs" style="bottom:1vmin;left:50%;transform:translateX(-50%)">'+mano(null,m)+'</div>';avisos();if(aviso)toast('Necesitas 3 tarjetas iguales');
}
function inicial(){
