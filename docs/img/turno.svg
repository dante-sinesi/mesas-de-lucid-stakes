<svg xmlns="http://www.w3.org/2000/svg" width="760" height="288" viewBox="0 0 760 288" role="img" font-family="'Cascadia Mono', Consolas, 'Courier New', monospace"><title>Un turno de Fundación</title><desc>Cada turno de Fundación: tiradas, cobro de todos, descarte si hace falta y una sola acción.</desc><rect width="760" height="288" fill="#1c1040"/><text x="30" y="36" font-size="20" font-weight="700" fill="#f2c94c" text-anchor="start">Un turno de Fundación</text><path d="M194 101 L216 101" fill="none" stroke="#b79cff" stroke-width="2"/><polygon points="216.0,101.0 207.0,96.0 207.0,106.0" fill="#b79cff"/><path d="M369 101 L391 101" fill="none" stroke="#b79cff" stroke-width="2"/><polygon points="391.0,101.0 382.0,96.0 382.0,106.0" fill="#b79cff"/><path d="M544 101 L566 101" fill="none" stroke="#b79cff" stroke-width="2"/><polygon points="566.0,101.0 557.0,96.0 557.0,106.0" fill="#b79cff"/><path d="M642.5 128 L642.5 182" fill="none" stroke="#b79cff" stroke-width="2"/><polygon points="642.5,182.0 637.5,173.0 647.5,173.0" fill="#b79cff"/><path d="M566 218 L544 218" fill="none" stroke="#b79cff" stroke-width="2"/><polygon points="544.0,218.0 553.0,213.0 553.0,223.0" fill="#b79cff"/><rect x="41" y="74" width="153" height="54" rx="4" fill="#1c1040" stroke="#b79cff" stroke-width="2"/><text x="117.5" y="97" font-size="14" font-weight="400" fill="#bfe3ff" text-anchor="middle">Empieza el</text><text x="117.5" y="115" font-size="14" font-weight="400" fill="#bfe3ff" text-anchor="middle">turno</text><rect x="216" y="74" width="153" height="54" rx="4" fill="#1c1040" stroke="#b79cff" stroke-width="2"/><text x="292.5" y="97" font-size="14" font-weight="400" fill="#bfe3ff" text-anchor="middle">Tiradas (0, 1 o</text><text x="292.5" y="115" font-size="14" font-weight="400" fill="#bfe3ff" text-anchor="middle">más)</text><rect x="391" y="81" width="153" height="40" rx="4" fill="#1c1040" stroke="#b79cff" stroke-width="2"/><text x="467.5" y="106" font-size="14" font-weight="400" fill="#bfe3ff" text-anchor="middle">Cobran todos</text><rect x="566" y="74" width="153" height="54" rx="4" fill="#1c1040" stroke="#b79cff" stroke-width="2"/><text x="642.5" y="97" font-size="14" font-weight="400" fill="#bfe3ff" text-anchor="middle">Descarta si hay</text><text x="642.5" y="115" font-size="14" font-weight="400" fill="#bfe3ff" text-anchor="middle">más de 6</text><rect x="566" y="182" width="153" height="72" rx="4" fill="#1c1040" stroke="#b79cff" stroke-width="2"/><text x="642.5" y="205" font-size="14" font-weight="400" fill="#bfe3ff" text-anchor="middle">Una acción:</text><text x="642.5" y="223" font-size="14" font-weight="400" fill="#bfe3ff" text-anchor="middle">construir o</text><text x="642.5" y="241" font-size="14" font-weight="400" fill="#bfe3ff" text-anchor="middle">entregar</text><rect x="391" y="198" width="153" height="40" rx="4" fill="#1c1040" stroke="#b79cff" stroke-width="2"/><text x="467.5" y="223" font-size="14" font-weight="400" fill="#bfe3ff" text-anchor="middle">Pasa el turno</text></svg>
